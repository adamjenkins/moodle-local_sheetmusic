name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # moodle.git main rows are non-blocking (experimental: true): main is a moving target.
    continue-on-error: ${{ matrix.experimental == true }}

    services:
      postgres:
        # Pinned to the lowest PostgreSQL that satisfies every branch in the matrix:
        # Moodle 5.2 requires 16+, 5.1 requires 15+, 5.0 requires 14+, 4.5 requires 13+
        # (each branch's own admin/environment.xml). moodle.git main (5.3) requires 17+
        # (environment.xml 5.3 block), so the main rows override the image via the matrix.
        image: ${{ matrix.database == 'pgsql' && (matrix.pgsql-image || 'postgres:16') || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        # Lowest MariaDB that satisfies every branch: 5.0/5.1/5.2 require 10.11+,
        # 4.5 requires 10.6.7+ (each branch's own admin/environment.xml). moodle.git main
        # (5.3) requires 11.4+ (environment.xml 5.3 block), overridden via the matrix.
        image: ${{ matrix.database == 'mariadb' && (matrix.mariadb-image || 'mariadb:10.11') || '' }}
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      # Every row below is a combination checked against the branch's own
      # admin/environment.xml (PHP and database minimums) and against the branch's
      # own .github/workflows/push.yml (the PHP versions core itself tests). Each
      # branch is run at its lowest and its highest supported PHP, and each branch
      # is exercised against both databases across its two rows. Nothing here is a
      # cross product, so no unsupported pair can be generated by accident.
      #
      # 4.5 is the floor because version.php requires 2024100700. This plugin is the shared
      # engine and has no Behat features of its own; its behaviour is proved by the PHPUnit
      # suite and by the JavaScript specs in the separate job below.
      # 4.5 refuses PHP 8.4 outright (restrict_php_version_84 in its environment.xml).
      # The last two rows run moodle.git main (= 5.3beta: PHP 8.3-8.4, PostgreSQL 17+,
      # MariaDB 11.4+ per its environment.xml 5.3 block). They are NON-BLOCKING
      # (experimental: true -> job-level continue-on-error) and skip the Grunt step.
      matrix:
        include:
          - {moodle-branch: 'MOODLE_405_STABLE', php: '8.1', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_405_STABLE', php: '8.3', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_500_STABLE', php: '8.2', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_500_STABLE', php: '8.4', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.2', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.4', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.4', database: 'pgsql'}
          - {moodle-branch: 'main', php: '8.4', database: 'pgsql', experimental: true, pgsql-image: 'postgres:17', mariadb-image: 'mariadb:11.4'}
          - {moodle-branch: 'main', php: '8.3', database: 'mariadb', experimental: true, pgsql-image: 'postgres:17', mariadb-image: 'mariadb:11.4'}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          (cd ci/bin && pwd) >> "$GITHUB_PATH"
          (cd ci/vendor/bin && pwd) >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail.
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        # Each Moodle branch ships its own JS toolchain and they do not produce
        # byte-identical minified bundles, so the stale-build half of this check can
        # only pass against the toolchain the committed bundle was built with. The
        # bundle in amd/build is built with the MOODLE_502_STABLE toolchain.
        if: ${{ !cancelled() && matrix.moodle-branch == 'MOODLE_502_STABLE' }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning


      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1

  js:
    name: JavaScript unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Run the specs
        # moodle-plugin-ci does not run these: they are plain node scripts driving the AMD
        # modules directly, and for this suite they are where most of the behaviour is proved.
        # Each spec prints its own summary line and exits non-zero on the first failed
        # assertion, so a spec that silently ran nothing cannot pass unnoticed.
        run: |
          set -e
          shopt -s nullglob
          ran=0
          for spec in tests/jsfixtures/*.spec.js; do
            echo "== $spec"
            node "$spec"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "No JavaScript specs were executed - refusing to report success." >&2
            exit 1
          fi
          echo "$ran spec file(s) passed."
