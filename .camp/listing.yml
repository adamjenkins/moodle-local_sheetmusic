name: local_sheetmusic
summary: 'The shared sheet-music engine for Moodle, engraving, importing, exporting and playing scores in the browser for the filter and TinyMCE plugins.'
description: |
  The engine behind the sheetmusic suite. It has no user interface of its own;
  filter_sheetmusic and tiny_sheetmusic use it so scores render identically
  everywhere. It holds the document model, ABC and MusicXML serialisers, a MIDI
  importer, SVG/PNG/PDF/MIDI export, a single-staff note editor, and a bundled
  Verovio engraver, all running client-side. Playback is synthesised in the
  browser with Web Audio, and site admins can set the default staff size or
  turn playback off.
